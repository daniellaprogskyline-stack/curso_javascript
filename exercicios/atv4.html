 <!DOCTYPE html>
 <html lang="pt-br">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        body {
            background-color: rgb(225, 225, 254);
            color: rgb(39, 1, 73);
            font-family: Arial, sans-serif;
            padding: 20px;
            font: normal 20px Arial;
        }
        </style>

 </head>
 <body>
    <h1>Olá mundo</h1>
    <p>Este é o meu primeiro programa em Javascript.</p>

<script>
   var nome = window.prompt('Qual seu nome?')
   document.write('Olá, ${nome}, seja bem-vindo! Seu nome tem ${nome.length} caracteres.')
   document.write('Seu nome em maiúsculas é ${nome.toUpperCase()}')
   document.write('Seu nome em minúsculas é ${nome.toLowerCase()}')
</script>
 </body>
 </html>
